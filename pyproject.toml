[project]
name = "seed"
version = "3.4.0"
description = "Standard Energy Efficiency Data (SEED) Platform™ is a web-based application that helps organizations easily manage data on the energy performance of large groups of buildings."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.md"]
requires-python = ">=3.12"
dependencies = [
    # Django core
    "django~=6.0.5",
    # Persistence (database)
    "psycopg[binary]~=3.3.4",
    # Background jobs / scheduling / caching
    "celery==5.6.3",
    "django-celery-beat==2.9.0",
    "django-redis==6.0.0",
    "hiredis==3.3.1",
    "tblib==3.2.2",
    # Assets / compression / utilities
    "brotli==1.2.0",
    "django-compressor==4.6.0",
    "django-extensions==4.1",
    "django-model-utils==5.0.0",
    "django-treebeard==5.0.5",
    # Date / time
    "python-dateutil==2.9.0.post0",
    # Units
    "django-pint==1.0.4",
    # Forms / filtering
    "django-filter==25.2",
    # API / auth / docs
    "djangorestframework==3.17.1",
    "djangorestframework-simplejwt==5.5.1",
    "drf-yasg==1.21.15",
    "drf-nested-routers==0.95.0",
    # Email / messaging
    "django-post-office==3.11.2",
    # Observability / monitoring
    "sentry-sdk==2.59.0",
    # Security / 2FA
    "django-two-factor-auth[phonenumbers]==1.18.1",
    "qrcode[pil]==8.2",
    "pyotp==2.9.0",
    # Data formats / parsing / IO
    "Markdown==3.10.2",
    "pyyaml==6.0.3",
    "xmltodict==1.0.4",
    "xmlschema==4.3.1",
    "lark==1.3.1",
    "requests==2.33.1",
    "polling==0.3.2",
    # Tabular / Excel
    "pandas==2.3.3",
    "xlsxwriter==3.2.9",
    "xlrd<2.0.0", # Version 2 removes xlsx support
    # Matching / address parsing
    "jellyfish==1.2.1",
    "street-address==0.4.0",
    "probablepeople==0.5.6",
    "usaddress==0.5.16",
    # Geo / Building data
    "shapely==2.1.2",
    "buildingid==2.2.1",
    # Integrations
    "buildingsync-asset-extractor==0.3.0", # BuildingSync Asset Extractor (includes lxml dependency required by SEED)
    "tkbl==0.7",
    "seed-salesforce==0.2.0",
    "simple-salesforce==1.12.9",
    # AWS / SES
    "boto3~=1.43.3",
    "django-ses==4.7.2",
    # Server
    "hypercorn==0.18.0",
    # Misc
    "geojson==3.2.0", # only used in managed tasks at the moment
    "semantic-version==2.10.0",
]

[project.urls]
Homepage = "https://seed-platform.org/"
Repository = "https://github.com/SEED-platform/seed"
Documentation = "https://seed-platform.readthedocs.io/en/stable/"
Issues = "https://github.com/SEED-platform/seed/issues"

[dependency-groups]
dev = [
    # Debug tooling
    "django-debug-toolbar==6.3.0",
    # Test runner + Django integration + utilities
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "responses==0.26.0",
    "vcrpy==8.1.1",
    "Faker~=40.15.0",
    "mock==5.2.0",
    "hypothesis~=6.152.7",
    # Coverage / reporting
    "coverage==7.14.0",
    "coveralls==4.1.0",
    # Local/CI orchestration
    "tox-uv-bare==1.35.2",
    "psutil==7.2.2",
    # Static code analysis / hooks
    "pre-commit>=4.6.0",
    # Documentation & spelling
    "Sphinx==9.1.0",
    "sphinxcontrib-spelling==8.0.2",
    "sphinx_rtd_theme==3.1.0",
    "docutils==0.22.4",
    # Types
    "celery-types>=0.26.0",
    "djangorestframework-stubs>=3.17.0",
    "types-Markdown>=3.10.2.20260408",
    "types-PyYAML>=6.0.12.20260408",
    "types-python-dateutil>=2.9.0.20260508",
    "types-requests>=2.33.0.20260513",
]

[tool.ruff]
target-version = "py314"

[tool.uv]
default-groups = ["dev"]
