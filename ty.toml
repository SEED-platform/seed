[src]
exclude = [
    "config/settings/",
    "**/migrations/",
    "docs/source/conf.py",
    "seed/tests/test_search.py",
]

[analysis]
# ty does not yet support Django's generated model attributes or plugin system.
# Faker providers and lxml submodules are also populated dynamically at runtime.
replace-imports-with-any = [
    "django.**",
    "faker.**",
    "lxml.**",
]

# ty does not support a baseline file yet. These narrow overrides suppress only
# the existing rule categories in affected legacy files; all other rules remain
# active. Remove files and rules from this list as their diagnostics are fixed.
[[overrides]]
include = [
    "seed/building_sync/mappings.py",
    "seed/data_importer/tests/test_equivalence_partitioner.py",
    "seed/decorators.py",
    "seed/lib/util.py",
    "seed/lib/xml_mapping/mapper.py",
    "seed/management/commands/create_test_user_json.py",
    "seed/models/compliance_metrics.py",
    "seed/renderers.py",
    "seed/test_helpers/fake.py",
    "seed/tests/test_audit_template.py",
    "seed/tests/test_data_view_views.py",
    "seed/tests/util.py",
    "seed/utils/address.py",
    "seed/utils/api.py",
    "seed/utils/match.py",
    "seed/utils/merge.py",
    "seed/utils/pagination.py",
    "seed/utils/tax_lot_properties.py",
]

[overrides.rules]
