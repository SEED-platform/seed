name: Dump SF secrets (manual)

# Manually-triggered helper to recover the Salesforce secrets stored in this
# repo. GitHub secrets are write-only, so the only way to read a value back is
# to have a workflow print it. GitHub automatically masks the raw secret value
# in logs, so each value is double-base64-encoded here to get it past the mask.
# Decode locally with:  echo '<value>' | base64 -d | base64 -d
#
# Delete this workflow (and consider rotating the secrets) once you have them.

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Encode secrets
        env:
          SF_INSTANCE: ${{ secrets.SF_INSTANCE }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
          SF_DOMAIN: ${{ secrets.SF_DOMAIN }}
        run: |
          for name in SF_INSTANCE SF_USERNAME SF_PASSWORD SF_SECURITY_TOKEN SF_DOMAIN; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "$name: <empty or not set>"
            else
              echo "$name: $(printf '%s' "$value" | base64 | base64 | tr -d '\n')"
            fi
          done
