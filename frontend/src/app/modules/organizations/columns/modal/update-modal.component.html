<h2 class="text-3xl leading-7 font-extrabold tracking-tight capitalize sm:leading-10 md:text-4xl" mat-dialog-title>Update Columns</h2>

<div class="mt-4 mb-4">
  @if (inProgress) {
    <mat-progress-bar [value]="progressBarObj.progress" mode="determinate"></mat-progress-bar>
  }
  @if (errorMessage) {
    <seed-alert type="error">{{ errorMessage }}</seed-alert>
  }
</div>
