<div class="mt-4 flex gap-4" mat-dialog-title>
  <mat-icon class="icon-size-5 text-current" svgIcon="fa-solid:pen-to-square"></mat-icon>
  <div class="text-2xl leading-6 font-medium">{{ create ? 'Create' : 'Rename' }} Email Template</div>
</div>
<mat-divider class="mb-8"></mat-divider>
<form class="flex flex-col gap-4" [formGroup]="form">
  <mat-form-field>
    <mat-label>Name</mat-label>
    <input matInput formControlName="name" placeholder="Template Name" />
    @if (form.controls.name?.hasError('required')) {
      <mat-error>Name is a required field</mat-error>
    }
  </mat-form-field>
</form>

<div class="flex justify-end">
  <mat-dialog-actions>
    <button [disabled]="form.invalid" (click)="onSubmit()" mat-raised-button color="primary">{{ create ? 'Create' : 'Save' }}</button>
  </mat-dialog-actions>
  <mat-dialog-actions>
    <button (click)="close()" mat-stroked-button>Cancel</button>
  </mat-dialog-actions>
</div>
