<div class="m-4 flex gap-4" mat-dialog-title>
  <mat-icon class="icon-size-5 text-current" svgIcon="fa-solid:pen-to-square"></mat-icon>
  <div class="text-2xl leading-6 font-medium">Data Quality Results</div>
</div>
<mat-divider class="mb-8"></mat-divider>
<div>
  @if (rowData.length) {
    <ag-grid-angular
      [columnDefs]="columnDefs"
      [rowData]="rowData"
      [theme]="gridTheme$ | async"
      [style.height.px]="520"
      [pagination]="true"
      [paginationPageSize]="10"
      [paginationPageSizeSelector]="[10, 50, 100]"
    >
    </ag-grid-angular>
  } @else {
    <div class="text-center text-gray-500">No warnings or errors</div>
  }
</div>

<div class="m-4 flex justify-end">
  <button (click)="dismiss()" mat-stroked-button>Dismiss</button>
</div>
