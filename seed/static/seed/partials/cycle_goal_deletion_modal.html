<div class="modal-header">
  <h4>Delete {$:: cycle_goal_name $}?</h4>
</div>

<div class="modal-footer container-fluid" style="display: flex">
  <button
    type="button"
    class="btn btn-primary col-sm-6 center-block"
    ng-click="delete_cycle_goal()"
    translate
  >
    Confirm
  </button>
  <button
    type="button"
    class="btn btn-default col-sm-6 center-block"
    ng-click="cancel()"
    translate
  >
    Dismiss
  </button>
</div>
