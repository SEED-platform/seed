sharedWorkspaceLockfile: false

packages:
  - .
  - ng_seed/seed-angular
  - vendors

allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  puppeteer: true
  unrs-resolver: true

# Keep in sync with ng_seed/seed-angular/pnpm-workspace.yaml: pnpm only reads overrides from the
# outermost pnpm-workspace.yaml, so the nested one is ignored when this root install runs.
overrides:
  less: ^4.9.1
